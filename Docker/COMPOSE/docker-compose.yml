version: "3.9"
   
services:
  mongo:
    container_name: mongo
    image: mongo:6-jammy
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_PASSWORD: init_pass
      MONGO_INITDB_DATABASE: init_db
      MONGO_INITDB_USERNAME: init_user
      MONGO_INITDB_ROOT_USERNAME: root_user
      MONGO_INITDB_ROOT_PASSWORD: root_pass
    networks:
      - mongo_network
    volumes:
      - /tmp/mongo-data:/data/db

  mongo-express:
    container_name: mongo-express
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: express_user
      ME_CONFIG_BASICAUTH_PASSWORD: express_pass
      ME_CONFIG_MONGODB_ADMINUSERNAME: root_user
      ME_CONFIG_MONGODB_ADMINPASSWORD: root_pass
    networks:
      - mongo_network
    depends_on:
      - mongo

networks:
  mongo_network:
    driver: bridge